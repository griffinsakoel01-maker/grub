<!DOCTYPE html>
<html lang="en-KE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grub – Plan meals. Shop smarter.</title>
<style>
:root{--g:#3DA832;--gd:#145A1E;--gl:#EFF8EA;--gt:#DDF0D3;--or:#FF8A1C;--ink:#1D2A1F;--mu:#6B7A6D;--line:#E6ECE4;--red:#D64545;--warn:#B7791F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E9F0E6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink)}
#phone{max-width:430px;height:100dvh;padding-top:env(safe-area-inset-top);margin:0 auto;background:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:500px){#phone{height:min(900px,96dvh);margin-top:2dvh;border-radius:36px;box-shadow:0 30px 80px #145a1e33}}
.scroll{flex:1;overflow-y:auto;padding:16px 20px 24px}
h1{font-size:25px;color:var(--gd);margin:6px 0 4px;letter-spacing:-.4px}
h2{font-size:19px;color:var(--gd);margin:22px 0 10px}
.mu{color:var(--mu)}.sm{font-size:12px}.b{font-weight:700}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px 4px}
.back{border:0;background:none;font-size:26px;color:var(--gd);width:36px;cursor:pointer}
.prog{flex:1;height:5px;background:var(--gl);border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--g);transition:width .3s}
.btn{display:block;width:100%;border:0;border-radius:18px;background:var(--g);color:#fff;font-size:16px;font-weight:700;padding:16px;cursor:pointer;transition:opacity .2s,transform .1s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.35}
.btn.o{background:#fff;color:var(--gd);border:1px solid var(--line)}
.foot{padding:10px 20px 16px;background:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 6px 16px #145a1e0f;margin-bottom:10px}
.card.sel{border:2px solid var(--g);background:var(--gl)}
.grid{display:grid;gap:10px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
.opt{position:relative;text-align:center;cursor:pointer;padding:14px 8px;margin:0;transition:transform .15s}
.opt .e{font-size:28px}.opt .t{font-weight:600;font-size:13px;margin-top:4px}.opt .s{font-size:11px;color:var(--mu)}
.opt.sel:after{content:"✓";position:absolute;top:6px;right:8px;background:var(--g);color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:18px}
.row{display:flex;align-items:center;gap:12px}
.emo{width:44px;height:44px;border-radius:13px;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:50%;border:0;font-size:18px;cursor:pointer;background:var(--gl);color:var(--gd)}
.step button.p{background:var(--gd);color:#fff}.step b{min-width:34px;text-align:center;font-size:18px}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0}
.sel .chk,.chk.on{background:var(--g);border-color:var(--g)}
.days{display:flex;justify-content:space-between;margin-top:30px}

.day.on{background:var(--g);color:#fff;border-color:var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;border-radius:20px;padding:8px 12px;background:var(--gl);font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--gd);color:#fff}
input[type=text],input[type=number],input[type=search]{width:100%;border:0;background:var(--gl);border-radius:14px;padding:14px 16px;font-size:16px;outline:none}
input:focus{box-shadow:0 0 0 1.5px var(--g)}
.big{font-size:44px;font-weight:800;text-align:center;letter-spacing:-1px;cursor:pointer}

.bar{height:10px;border-radius:10px;background:var(--gl);overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:10px;transition:width .6s}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;background:var(--gl);color:var(--g)}
.badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:7px;background:#B7791F1a;color:var(--warn)}
.meal{display:flex;align-items:center;gap:12px;padding:10px;margin-bottom:8px}
.img{width:54px;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;background:linear-gradient(135deg,#EFF8EA,#D4EDC8)}
.img.breakfast{background:linear-gradient(135deg,#FFF3E0,#FFE0B2)}.img.snack{background:linear-gradient(135deg,#FFF8E1,#FFECB3)}
.lbl{font-size:10px;font-weight:700;color:var(--mu);letter-spacing:.4px}
.swap{border:0;background:none;color:var(--g);font-weight:700;cursor:pointer;font-size:13px}
.orbit{position:relative;width:200px;height:200px;margin:30px auto 20px}
.orbit img{position:absolute;left:50%;top:50%;width:96px;transform:translate(-50%,-50%);animation:pulse 1.6s ease-in-out infinite}
.orbit span{position:absolute;left:50%;top:50%;font-size:22px;margin:-14px 0 0 -14px;animation:spin 6s linear infinite}
@keyframes spin{from{transform:rotate(var(--a)) translateX(82px) rotate(calc(-1*var(--a)))}to{transform:rotate(calc(var(--a) + 360deg)) translateX(82px) rotate(calc(-1*var(--a) - 360deg))}}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.06)}}
.stage{display:flex;align-items:center;gap:12px;padding:6px 0;color:var(--mu)}.stage.done{color:var(--ink)}

.nav{display:flex;border-top:1px solid var(--line);background:#fff;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:none;padding:6px 0;font-size:11px;font-weight:600;color:var(--mu);cursor:pointer}
.nav button i{display:block;font-style:normal;font-size:20px;margin:0 auto 2px;width:56px;border-radius:14px;padding:2px 0}
.nav button.on{color:var(--gd)}.nav button.on i{background:var(--gt)}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.qa .card{text-align:center;padding:12px 6px;margin:0;cursor:pointer;font-size:12px;font-weight:600}
.qa .emo{margin:0 auto 6px}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}.hs .card{min-width:150px;max-width:150px;padding:8px;cursor:pointer}
.hs .img{width:100%;height:90px;font-size:40px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f1f4f0}
.item.done .nm{text-decoration:line-through;color:var(--mu)}
.qty{display:flex;align-items:center;gap:4px}.qty button{width:26px;height:26px;border-radius:50%;border:0;background:var(--gl);cursor:pointer;color:var(--gd);font-weight:700}
.sec{font-size:11px;font-weight:800;color:var(--mu);letter-spacing:.8px;margin:18px 0 2px}
.totals{border-radius:22px 22px 0 0;box-shadow:0 -4px 16px #0000001a;padding:14px 20px 16px;background:#fff}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:14px 0}.tabs button{flex:1;border:0;background:none;padding:10px;font-weight:600;color:var(--mu);cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--gd);border-color:var(--g)}
.hero{height:220px;display:flex;align-items:center;justify-content:center;font-size:110px;background:linear-gradient(135deg,#EFF8EA,#C5E1A5);position:relative}
.hero .back{position:absolute;top:14px;left:14px;background:#fff;border-radius:50%;height:38px;width:38px;font-size:22px}
.macro{display:flex;height:6px;border-radius:6px;overflow:hidden;margin:6px 0}
.banner{background:#FFF4E5;color:var(--warn);font-size:12px;font-weight:600;border-radius:12px;padding:8px 12px;margin:8px 0}
.sheet{position:absolute;inset:0;background:#0006;display:flex;align-items:flex-end;z-index:5;animation:fade .2s}
.sheet>div{background:#fff;border-radius:24px 24px 0 0;width:100%;max-height:80%;overflow:auto;padding:18px 20px 24px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}@keyframes fade{from{opacity:0}}
.toast{position:absolute;left:20px;right:20px;bottom:90px;background:var(--gd);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;z-index:9;animation:up .2s}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 30px;position:relative}
.welcome .f{position:absolute;font-size:28px;opacity:.85;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.fade{animation:fade .35s}
</style>

<body>
<div id="phone"></div>
<script>// JS port of lib/services/calculation_service.dart + meal_planner_service.dart
// (same rules, used by the interactive preview and tested in test.js)
(function (root) {
  const EPS = 1e-6;
  const toBase = (a, u) => ({ kg: 1000, l: 1000, tbsp: 15, tsp: 5, cup: 250 }[u] || 1) * a;
  const scale = (q, orig, sel) => (orig > 0 ? q * (sel / orig) : q);
  const packagesNeeded = (q, size) => (q <= EPS ? 0 : size <= 0 ? 1 : Math.ceil(q / size - EPS));
  const lineCost = (q, p) => Math.round(p.price * 100) * packagesNeeded(q, p.packageSize); // cents
  const consumedCost = (q, p) => Math.round((p.price * 100 * q) / p.packageSize);

  function makeCatalog(products, recipes, supermarkets, prices) {
    const byId = (a) => Object.fromEntries(a.map((x) => [x.id, x]));
    return { products: byId(products), recipes: byId(recipes), supermarkets: byId(supermarkets), prices };
  }
  function recipeReqs(r, servings, cat) {
    return r.ingredients
      .filter((i) => cat.products[i.productId])
      .map((i) => ({ productId: i.productId, quantity: toBase(scale(i.amount, r.servings, servings), i.unit), recipeIds: [r.id] }));
  }
  function aggregate(reqs) {
    const m = {};
    for (const r of reqs) {
      if (!m[r.productId]) m[r.productId] = { productId: r.productId, quantity: 0, recipeIds: [] };
      m[r.productId].quantity += r.quantity;
      for (const id of r.recipeIds) if (!m[r.productId].recipeIds.includes(id)) m[r.productId].recipeIds.push(id);
    }
    return m;
  }
  function planReqs(meals, cat) {
    return aggregate(meals.flatMap((m) => (cat.recipes[m.recipeId] ? recipeReqs(cat.recipes[m.recipeId], m.portions, cat) : [])));
  }
  const toPurchase = (req, have) => Math.max(0, req - have);
  function subtractPantry(req, pantry) {
    const out = {};
    for (const [id, r] of Object.entries(req)) {
      const q = toPurchase(r.quantity, pantry[id] || 0);
      if (q > EPS) out[id] = q;
    }
    return out;
  }
  const rank = { verified: 0, user_submitted: 1, estimated: 2, demo: 3 };
  function bestPrice(pid, q, cat, shop) {
    let best = null, bc = null;
    for (const p of cat.prices) {
      if (p.productId !== pid || (shop && p.supermarketId !== shop)) continue;
      const c = lineCost(q, p);
      if (bc === null || c < bc || (c === bc && rank[p.verificationStatus] < rank[best.verificationStatus])) { best = p; bc = c; }
    }
    return best;
  }
  function costBasket(toBuy, cat, shop) {
    const lines = Object.entries(toBuy).filter(([id]) => cat.products[id]).map(([id, q]) => {
      const price = bestPrice(id, q, cat, shop);
      return { product: cat.products[id], required: q, price, packages: price ? packagesNeeded(q, price.packageSize) : 0, cost: price ? lineCost(q, price) : 0 };
    });
    lines.sort((a, b) => a.product.category.localeCompare(b.product.category) || a.product.name.localeCompare(b.product.name));
    return { shop: shop || '', lines, total: lines.reduce((s, l) => s + l.cost, 0), missing: lines.filter((l) => !l.price).length };
  }
  function basketsByShop(toBuy, cat) {
    return Object.values(cat.supermarkets).map((s) => costBasket(toBuy, cat, s.id)).filter((b) => b.lines.some((l) => l.price))
      .sort((a, b) => (a.missing === 0) !== (b.missing === 0) ? (a.missing === 0 ? -1 : 1) : a.total - b.total);
  }
  function recipeCost(r, servings, cat, shop) {
    let t = 0;
    for (const q of recipeReqs(r, servings, cat)) {
      const p = bestPrice(q.productId, q.quantity, cat, shop) || bestPrice(q.productId, q.quantity, cat);
      if (!p) return null;
      t += consumedCost(q.quantity, p);
    }
    return t;
  }
  const periodDays = (f, custom) => ({ daily: 1, weekly: 7, biweekly: 14, monthly: 30 }[f] || Math.max(1, custom || 7));
  const budgetForDays = (cents, f, custom, days) => Math.round((cents * days) / periodDays(f, custom));
  const weights = { breakfast: 0.2, lunch: 0.35, dinner: 0.4, snack: 0.05 };
  function breakdown(cents, days, slots, portions) {
    const d = Math.max(1, days), perDay = Math.round(cents / d), ch = slots.length ? slots : ['lunch'];
    const ws = ch.reduce((a, s) => a + weights[s], 0);
    const perSlot = Object.fromEntries(ch.map((s) => [s, Math.round((perDay * weights[s]) / ws)]));
    return { perDay, perSlot, perPortion: portions > 0 ? Math.round(perDay / (ch.length * portions)) : 0 };
  }
  function productAllowed(p, prof) {
    const t = p.dietTags || [], diets = prof.diets || [];
    if ((p.allergens || []).some((a) => (prof.allergies || []).includes(a))) return false;
    if ((prof.dislikes || []).includes(p.id)) return false;
    if (diets.includes('vegan') && t.some((x) => ['meat', 'fish', 'dairy', 'egg'].includes(x))) return false;
    if (diets.includes('vegetarian') && t.some((x) => ['meat', 'fish'].includes(x))) return false;
    if (diets.includes('pescatarian') && t.includes('meat')) return false;
    return true;
  }
  const recipeAllowed = (r, cat, prof) => r.ingredients.every((i) => cat.products[i.productId] && productAllowed(cat.products[i.productId], prof));
  const eligible = (slot, cat, prof) => Object.values(cat.recipes).filter((r) => r.category === slot && recipeAllowed(r, cat, prof));

  function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

  // Same algorithm as MealPlannerService.generate
  function generatePlan({ prof, cat, start, days, budget, pantry = {}, shop = '', seed = 1 }) {
    const rnd = rng(seed), portions = Math.max(1, prof.adults + prof.kids * 0.5) || 1;
    const slots = prof.mealSlots.length ? prof.mealSlots : ['lunch', 'dinner'];
    const dayIdx = [];
    for (let i = 0; i < days; i++) {
      const wd = ((new Date(start.getTime() + i * 864e5).getDay() + 6) % 7) + 1;
      if (!prof.cookingDays.length || prof.cookingDays.includes(wd)) dayIdx.push(i);
    }
    const bd = breakdown(budget, dayIdx.length, slots, portions);
    const cache = {};
    const costOf = (r) => (cache[r.id] ??= recipeCost(r, portions, cat, shop) ?? 2 ** 30);
    const meals = [], use = {}, notes = [];
    for (const slot of slots) {
      const opts = eligible(slot, cat, prof);
      if (!opts.length) { notes.push(`No ${slot} recipes match your diet and allergies.`); continue; }
      const target = Math.max(1, bd.perSlot[slot] || 0);
      for (const d of dayIdx) {
        const score = (r) => {
          const c = costOf(r);
          let s = c > target ? ((c - target) / target) * 2 : ((target - c) / target) * 0.6;
          s += (use[r.id] || 0) * 0.7;
          if (prof.style === 'quick' && r.prepMinutes + r.cookMinutes > 40) s += 0.4;
          if (prof.style === 'budget' && (r.tags || []).includes('budget')) s -= 0.2;
          return s + rnd() * 0.25;
        };
        const scored = opts.map((r) => [score(r), r]).sort((a, b) => a[0] - b[0]);
        const pick = scored[0][1];
        use[pick.id] = (use[pick.id] || 0) + 1;
        meals.push({ dayIndex: d, slot, recipeId: pick.id, portions });
      }
    }
    const basketFor = (ms) => costBasket(subtractPantry(planReqs(ms, cat), pantry), cat, shop);
    let basket = basketFor(meals), guard = 0;
    while (basket.total > budget && guard++ < 60) {
      const sorted = [...meals].sort((a, b) => costOf(cat.recipes[b.recipeId]) - costOf(cat.recipes[a.recipeId]));
      let improved = false;
      for (const m of sorted) {
        const cur = costOf(cat.recipes[m.recipeId]);
        const cheaper = eligible(m.slot, cat, prof).filter((r) => costOf(r) < cur)
          .sort((a, b) => (use[a.id] || 0) - (use[b.id] || 0) || costOf(a) - costOf(b));
        if (!cheaper.length) continue;
        use[m.recipeId]--; use[cheaper[0].id] = (use[cheaper[0].id] || 0) + 1;
        m.recipeId = cheaper[0].id; improved = true; break;
      }
      if (!improved) break;
      basket = basketFor(meals);
    }
    meals.sort((a, b) => a.dayIndex - b.dayIndex || slots.indexOf(a.slot) - slots.indexOf(b.slot));
    if (basket.total > budget) notes.push('Even the cheapest suitable meals are over budget.');
    return { meals, basket, budget, within: basket.total <= budget, notes, basketFor };
  }

  const fmt = (cents) => {
    const neg = cents < 0, a = Math.abs(cents);
    const s = a % 100 ? (a / 100).toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : Math.round(a / 100).toLocaleString('en-KE');
    return (neg ? '-' : '') + 'KSh ' + s;
  };
  const display = (q, unit) => {
    const n = (v) => (Math.abs(v - Math.round(v)) < 0.01 ? String(Math.round(v)) : (+v.toFixed(v < 10 ? 2 : 1)).toString());
    if (unit === 'g') return q >= 1000 ? n(q / 1000) + ' kg' : n(q) + ' g';
    if (unit === 'ml') return q >= 1000 ? n(q / 1000) + ' litres' : n(q) + ' ml';
    if (unit === 'bunch') return n(q) + (q === 1 ? ' bunch' : ' bunches');
    return n(q) + ' pcs';
  };
  const api = { toBase, scale, packagesNeeded, lineCost, consumedCost, makeCatalog, recipeReqs, aggregate, planReqs, toPurchase, subtractPantry,
    bestPrice, costBasket, basketsByShop, recipeCost, periodDays, budgetForDays, breakdown, productAllowed, recipeAllowed, eligible, generatePlan, fmt, display };
  if (typeof module !== 'undefined') module.exports = api; else root.Calc = api;
})(this);

// ------------------------------------------------ onboarding steps (video flow)
const STEPS=[
 {t:'Karibu! What should we call you?',s:'Grub plans meals around your family and your budget.',ok:()=>S.prof.name.trim(),
  b:()=>`<input type="text" id="nm" placeholder="Your first name" value="${esc(S.prof.name)}" oninput="S.prof.name=this.value;upd()">`},

 {t:'Who\'s eating?',s:'Every meal scales to your household automatically.',ok:()=>portions()>0,

 {t:'Which meals?',s:'Pick what we should plan for each day.',ok:()=>S.prof.mealSlots.length,

 {t:'Which days are you cooking?',s:'We\'ll only plan meals for the days you pick.',ok:()=>S.prof.cookingDays.length,

 {t:'How do you eat?',s:'Pick any that apply.',opt:1,

   `<div class="card opt ${(k==='none'?!S.prof.diets.length:S.prof.diets.includes(k))?'sel':''}" onclick="${k==='none'?'S.prof.diets=[]':`toggle(S.prof.diets,'${k}')`};render()"><div class="e">${e}</div><div class="t">${t}</div><div class="s">${s}</div></div>`).join('')}</div>`},
 {t:'Any allergies?',s:'We\'ll never include these – even when looking for savings.',opt:1,

   `<div class="card opt ${(k==='none'?!S.prof.allergies.length:S.prof.allergies.includes(k))?'sel':''}" onclick="${k==='none'?'S.prof.allergies=[]':`toggle(S.prof.allergies,'${k}')`};render()"><div class="e">${e}</div><div class="t">${t}</div><div class="s">${k==='none'?'nothing to exclude':'tap to exclude'}</div></div>`).join('')}</div>`},
 {t:'Any dislikes?',s:'We\'ll keep these out of every plan.',opt:1,
  b:()=>`<div class="chips">${Object.values(cat.products).filter(p=>!['cooking','spices'].includes(p.category)).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<button class="chip ${S.prof.dislikes.includes(p.id)?'on':''}" onclick="toggle(S.prof.dislikes,'${p.id}');render()">${p.emoji} ${prodName(p)}</button>`).join('')}</div>`},

function person(e,t,s,k){return `<div class="card row"><div class="emo">${e}</div><div style="flex:1"><div class="b">${t}</div><div class="mu sm">${s}</div></div><div class="step"><button onclick="S.prof.${k}=Math.max(0,S.prof.${k}-1);render()">−</button><b>${S.prof[k]}</b><button class="p" onclick="S.prof.${k}=Math.min(15,S.prof.${k}+1);render()">+</button></div></div>`}
function toggleSlot(k){toggle(S.prof.mealSlots,k);S.prof.mealSlots.sort((a,b)=>['breakfast','lunch','dinner','snack'].indexOf(a)-['breakfast','lunch','dinner','snack'].indexOf(b));render()}
function pantryGrid(){
  const ps=Object.values(cat.products).filter(p=>!S.q||p.name.toLowerCase().includes(S.q.toLowerCase()));
  return `<input type="search" placeholder="Search foods" value="${esc(S.q)}" oninput="S.q=this.value;render();setTimeout(()=>{const i=$('input[type=search]');i.focus();i.setSelectionRange(99,99)})"><div class="grid g3" style="margin-top:12px">${ps.map(p=>{const h=S.pantry[p.id]||0;return `<div class="card opt ${h?'sel':''}" onclick="togglePantry('${p.id}')"><div class="e">${p.emoji}</div><div class="t">${prodName(p)}</div>${h?`<div class="s">${Calc.display(h,p.unit)}</div>`:''}</div>`}).join('')}</div>`}
function togglePantry(id){const p=cat.products[id];if(S.pantry[id]){const inSheet=!!document.querySelector('.sheet');ask(`How much ${prodName(p)} do you have? (${p.unit==='g'?'grams':p.unit==='ml'?'ml':p.unit}; 0 removes it)`,S.pantry[id],v=>{const n=parseFloat(v);if(!n)delete S.pantry[id];else S.pantry[id]=n;render();if(inSheet)sheet('<h2 style=margin-top:0>What do I already have?</h2>'+pantryGrid())})}else{S.pantry[id]=p.defaultPackageSize;render()}}
function need(){
  const prof={...S.prof},por=portions(),days=Calc.periodDays(S.prof.freq),cd=Math.round(days*S.prof.cookingDays.length/7);let min=0,typ=0;
  for(const sl of prof.mealSlots){const c=Calc.eligible(sl,cat,prof).map(r=>Calc.recipeCost(r,por,cat)).filter(x=>x!==null).sort((a,b)=>a-b);if(c.length){min+=c[0];typ+=c[c.length>>1]}}
  return {min:Math.round(min*cd/100)*100,typ:Math.round(typ*cd/100)*100,meals:cd*prof.mealSlots.length,serv:cd*prof.mealSlots.length*por,days};
}
function budgetStep(){
  const n=need(),b=S.prof.budget,lo=Math.max(10000,Math.floor(n.min*.8/10000)*10000),hi=Math.max(lo+100000,Math.ceil(n.typ*2.5/50000)*50000,b),diff=b-n.typ;
  const word={daily:'day',weekly:'week',biweekly:'2 weeks',monthly:'month'}[S.prof.freq];const bd0=Calc.breakdown(b,n.days,S.prof.mealSlots,portions()),bd={perDay:Math.round(bd0.perDay/100)*100,perPortion:Math.round(bd0.perPortion/100)*100};
  return `<p class="mu" style="margin-top:-6px">${S.prof.adults} adults · ${S.prof.kids} kids · ${S.prof.mealSlots.length} meals/day · ${portions()} portions/meal</p>
  <div class="chips">${['daily','weekly','biweekly','monthly'].map(f=>`<button class="chip ${S.prof.freq===f?'on':''}" onclick="setFreq('${f}')">${{daily:'Daily',weekly:'Weekly',biweekly:'Every 2 weeks',monthly:'Monthly'}[f]}</button>`).join('')}</div>
  <div class="big" style="margin-top:22px" onclick="typeBudget()">${F(b)} <span style="font-size:16px">✎</span></div><p class="mu sm" style="text-align:center;margin:0">per ${word} · tap amount to type any number</p>
  <input type="range" min="${lo}" max="${hi}" step="5000" value="${b}" oninput="S.prof.budget=+this.value;renderKeepRange()">
  <div class="row sm mu" style="justify-content:space-between"><span>${F(lo)}</span><span>${F(hi)}</span></div>
  <div class="card" style="margin-top:14px;background:${diff<0?'#FFF4E5':'var(--gl)'}"><div class="row" style="align-items:flex-start"><span style="font-size:20px">${diff<0?'⚠️':'⭐'}</span><div><div class="b">${diff<0?'A tight budget':'Room to spare'}</div><div class="mu sm" style="margin-top:4px;line-height:1.4">${diff<0?`${F(b)} is about ${F(-diff)} under what a typical ${word} costs (~${F(n.typ)}). We'll lean on budget meals like githeri and ugali-sukuma.`:`${F(b)} is about ${F(diff)} over what a typical ${word} needs (~${F(n.typ)}) — room for nicer picks.`}</div></div></div></div>
  <div class="stats"><div class="card stat"><b>${F(bd.perDay)}</b><span>PER DAY</span></div><div class="card stat"><b>${n.meals}</b><span>MEALS</span></div><div class="card stat"><b>${n.serv}</b><span>SERVINGS</span></div></div>
  <p class="mu sm">About ${F(bd.perPortion)} per portion per meal. Estimates use Grub's demo price list.</p>`}
function setFreq(f){const o=Calc.periodDays(S.prof.freq),n=Calc.periodDays(f);S.prof.budget=Math.max(5000,Math.round(S.prof.budget*n/o/5000)*5000);S.prof.freq=f;render()}
function typeBudget(){ask('Enter your budget (KSh)',S.prof.budget/100,v=>{const n=parseInt(v);if(n>0){S.prof.budget=n*100;render()}})}
let rk=0;function renderKeepRange(){clearTimeout(rk);rk=setTimeout(()=>{const y=$('.scroll')?.scrollTop;render();$('.scroll').scrollTop=y;$('input[type=range]')?.focus()},60)}
function upd(){const b=$('#next');if(b)b.disabled=!(STEPS[S.step].ok?.()??true)}

function onboarding(){
  const st=STEPS[S.step],last=S.step===STEPS.length-1;
  const label=last?'Build my week':S.step===1&&S.prof.shops.length?'Confirm shops':S.step===8&&Object.keys(S.pantry).length?`Continue · ${Object.keys(S.pantry).length} selected`:S.step===6?'Confirm & continue':'Next';
  return `<div class="top"><button class="back" onclick="S.step?go('onb',{step:S.step-1}):go('welcome')">‹</button><div class="prog"><i style="width:${(S.step+1)/STEPS.length*100}%"></i></div><img src="${ICON}" height="26">${st.opt?`<button class="swap" onclick="go('onb',{step:S.step+1,q:''})">Skip</button>`:''}</div>
  <div class="scroll fade"><h1>${st.t}</h1>${st.s?`<p class="mu" style="margin:0 0 18px">${st.s}</p>`:''}${st.b()}</div>
  <div class="foot"><button class="btn" id="next" ${(st.ok?.()??true)?'':'disabled'} onclick="${last?'build()':`go('onb',{step:S.step+1,q:''})`}">${label}</button></div>`}

// ------------------------------------------------ build + week ready
const STAGES=['Browsing this week\'s prices…','Selecting your recipes…','Costing your basket…','Checking the budget…','Finalising your plan…'];
function build(){
  const days=7,budget=Calc.budgetForDays(S.prof.budget,S.prof.freq,7,days);
  S.result=Calc.generatePlan({prof:S.prof,cat,start,days,budget,pantry:S.pantry,shop:S.prof.shops[0]||'',seed:Date.now()%100000});
  S.stage=0;go('build');
  const t=setInterval(()=>{S.stage++;if(S.stage>STAGES.length){clearInterval(t);go('ready')}else render()},650);
}
function building(){return `<div class="scroll" style="display:flex;flex-direction:column;justify-content:center"><div class="orbit"><img src="${ICON}">${['🥦','🍅','🌽','🥑','🥕','🍋','🫑','🍌'].map((e,i)=>`<span style="--a:${i*45}deg">${e}</span>`).join('')}</div>
 <p class="b" style="text-align:center">${STAGES[Math.min(S.stage,4)]}</p><div style="max-width:260px;margin:0 auto">${STAGES.map((s,i)=>`<div class="stage ${i<S.stage?'done':i===S.stage?'cur':''}"><div class="dot">${i<S.stage?'✓':''}</div>${s}</div>`).join('')}</div></div>`}
function mealRow(m,i,swap){const r=cat.recipes[m.recipeId],d=new Date(start.getTime()+m.dayIndex*864e5);

function ready(){const r=S.result,b=r.basket,saved=r.budget-b.total;
