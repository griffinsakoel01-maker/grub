name: grub
description: Grub – Plan meals. Shop smarter. Kenyan grocery planning & budgeting app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  cloud_functions: ^5.1.3
  google_sign_in: ^6.2.1
  # State, utilities
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  # UI
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  # Sharing / export
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  # Admin uploads
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/branding/anim/
    - assets/seed/

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: assets/branding/grub_icon.png
    background_color: "#FFFFFF"
    theme_color: "#3DA832"
  image_path: assets/branding/grub_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/grub_icon.png

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/grub_icon.png
  android_12:
    color: "#FFFFFF"
    image: assets/branding/grub_icon.png
