<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Plan Kenyan meals, calculate groceries and stay on budget.">
  <meta name="theme-color" content="#3DA832">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Grub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Grub – Plan meals. Shop smarter.</title>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    /* Grub loading animation, shown while the app downloads */
    #grub-loader {
      position: fixed; inset: 0; z-index: 9999; background: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity .45s ease;
    }
    #grub-loader.hide { opacity: 0; pointer-events: none; }
    #grub-loader video, #grub-loader img { width: min(92vw, 92vh, 560px); height: auto; display: block; }
    #grub-loader img { display: none; }
    #grub-loader .bar {
      width: 120px; height: 4px; border-radius: 4px; background: #EFF8EA; overflow: hidden;
      margin-top: 8px; opacity: 0; transition: opacity .3s;
    }
    #grub-loader .bar i {
      display: block; width: 40%; height: 100%; background: #3DA832; border-radius: 4px;
      animation: grub-slide 1.1s ease-in-out infinite;
    }
    #grub-loader.waiting .bar { opacity: 1; }
    @keyframes grub-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
  </style>
</head>
<body>
  <div id="grub-loader">
    <video id="grub-video" src="loading/grub-loading.mp4" muted autoplay playsinline preload="auto"></video>
    <img id="grub-still" src="loading/grub-logo-final.jpg" alt="Grub">
    <div class="bar"><i></i></div>
  </div>
  <script>
    (function () {
      var loader = document.getElementById('grub-loader');
      var video = document.getElementById('grub-video');
      var still = document.getElementById('grub-still');
      var animDone = false, appReady = false;
      function finish() {
        if (!(animDone && appReady)) {
          if (animDone) loader.className = 'waiting';
          return;
        }
        loader.className = 'hide';
        setTimeout(function () { loader.remove(); }, 500);
      }
      function showStill() {
        video.style.display = 'none';
        still.style.display = 'block';
        animDone = true; finish();
      }
      video.addEventListener('ended', function () { animDone = true; finish(); });
      video.addEventListener('error', showStill);
      var p = video.play && video.play();
      if (p && p.catch) p.catch(showStill);         // autoplay blocked → show the logo
      setTimeout(function () { if (!animDone) showStill(); }, 7000);
      window.addEventListener('flutter-first-frame', function () { appReady = true; finish(); });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
